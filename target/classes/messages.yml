# ---------------- Кодекс ----------------
codex:
  pages:
    1:
      title: "<gold>Страница I — Что такое скалк"
      text:
        - "Скалк — не грибок и не болезнь."
        - "Это память. Всё, что было погребено под миром,"
        - "однажды начинает петь."
        - ""
        - "Тот, кто слышит этот хор, называется Слушающим."
    2:
      title: "<gold>Страница II — Древний город"
      text:
        - "Город построили те, кто первыми услышал хор."
        - "Они думали, что смогут жить рядом с ним."
        - ""
        - "Теперь там только скалк, крикуны"
        - "и Хранитель, который охраняет тишину."
    3:
      title: "<gold>Страница III — Заражение"
      text:
        - "Рядом со скалком заражение растёт."
        - "На 25% появляется тошнота и шёпот."
        - "На 50% приходит Тьма."
        - "На 75% — слабость и голоса."
        - "На 100% хор забирает тело, но даёт вдвое больше эха."
        - ""
        - "Очищающая эссенция и Амулет Тишины помогают."
    4:
      title: "<gold>Страница IV — Ритуал"
      text:
        - "Чтобы позвать Глашатая, нужен Ключ Бездны"
        - "и круг из скалка вокруг катализатора."
        - ""
        - "Схему можно посмотреть командой <white>/lor ritual</white>."
        - "Ритуал открывается с пятой главы."
    5:
      title: "<gold>Страница V — Глашатай"
      text:
        - "Глашатай — не Хранитель."
        - "Хранитель охраняет. Глашатай говорит."
        - ""
        - "Три фазы. Звук, тьма, призыв."
        - "Победа даёт Сердце Хора и место в финале истории."
